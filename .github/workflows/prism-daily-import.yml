name: UW PRISM Daily Import

run-name: UW PRISM - ${{ github.event_name }}

on:
  # Run slightly away from the top of the hour because GitHub documents
  # heavier scheduled-workflow load at :00. Timezone keeps this correct
  # automatically across GMT/BST.
  schedule:
    - cron: "7 7,8,11,14,17 * * *"
      timezone: "Europe/London"

  workflow_dispatch:
    inputs:
      force_check:
        description: "Open UW even if PRISM already has today's snapshot"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: uw-prism-daily-import
  cancel-in-progress: false

jobs:
  collect-prism:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PRISM_APPS_SCRIPT_URL: ${{ secrets.PRISM_APPS_SCRIPT_URL }}
      PRISM_UW_STORAGE_STATE_B64: ${{ secrets.PRISM_UW_STORAGE_STATE_B64 }}
      PRISM_FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.force_check }}

    steps:
      - name: Check UK schedule slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UK_HOUR="$(TZ=Europe/London date +%H)"
          case "$UK_HOUR" in
            07|08|11|14|17)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Running scheduled PRISM check in the ${UK_HOUR}:00 UK slot."
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Candidate UTC trigger is not a PRISM UK-time slot. Exiting."
              ;;
          esac

      - name: Check whether today's PRISM snapshot already exists
        id: snapshot
        if: steps.slot.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_check }}" = "true" ]; then
            echo "run_collector=true" >> "$GITHUB_OUTPUT"
            echo "Manual force check requested."
            exit 0
          fi

          TODAY="$(TZ=Europe/London date +%F)"
          RESPONSE="$(curl -fsSL "$PRISM_APPS_SCRIPT_URL")"

          if echo "$RESPONSE" | jq -e --arg d "$TODAY" '.ok == true and (.dates | index($d) != null)' >/dev/null; then
            echo "run_collector=false" >> "$GITHUB_OUTPUT"
            echo "PRISM already contains the verified snapshot for $TODAY. Nothing else to do."
          else
            echo "run_collector=true" >> "$GITHUB_OUTPUT"
            echo "No verified PRISM snapshot found for $TODAY. Continuing to UW."
          fi

      - name: Check out repository
        if: steps.snapshot.outputs.run_collector == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.snapshot.outputs.run_collector == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install collector dependencies
        if: steps.snapshot.outputs.run_collector == 'true'
        working-directory: automation
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        if: steps.snapshot.outputs.run_collector == 'true'
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Collect and publish PRISM snapshot
        if: steps.snapshot.outputs.run_collector == 'true'
        working-directory: automation
        run: node prism-cloud-collector.js

      - name: Upload PRISM run report
        if: always() && steps.snapshot.outputs.run_collector == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prism-run-${{ github.run_id }}
          path: automation/run-report.json
          if-no-files-found: ignore
          retention-days: 30
